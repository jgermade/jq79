# Does the editor extension still color and check what it claims to?
#
# Its grammars are written against VS Code's own HTML, JS, TS and CSS grammars,
# so their tests tokenize with those, pinned to one VS Code release
# (editors/vscode/test/fetch-grammars.mjs). Its language server reads a
# component with the runtime's own src/transform.ts, src/source.ts and
# src/html.ts (its character references), and is
# held to every component in tutorial/ checking clean - so a change to any of
# those runs it too, and nothing else in the repo reaches it. editors/check/
# is that checker as the jq79-check package, built from here.

name: VS Code extension

on:
  push:
    branches: [main]
    paths:
      - 'editors/vscode/**'
      - 'editors/check/**'
      - 'src/transform.ts'
      - 'src/source.ts'
      - 'src/html.ts'
      - 'tutorial/**'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    branches: [main]
    paths:
      - 'editors/vscode/**'
      - 'editors/check/**'
      - 'src/transform.ts'
      - 'src/source.ts'
      - 'src/html.ts'
      - 'tutorial/**'
      - '.github/workflows/vscode-extension.yml'

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm install

      - run: npm test

      # jq79-check is this extension's checker, published on its own: that it
      # still packs (build, the files it ships) is checked with the rest
      - name: jq79-check packs
        working-directory: editors/check
        run: npm pack --dry-run

      # what *Release VS Code extension* publishes: that it still packages
      # (icon, license, README links) is checked here, not on release day
      - name: The extension packs
        run: |
          npm run package
          rm jq79-vscode-*.vsix
