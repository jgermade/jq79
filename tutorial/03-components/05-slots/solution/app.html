<script :setup>
  const List = await import("./List.html")

  let orders = [
    { id: 1, label: "Keyboard", total: 4900 },
    { id: 2, label: "Monitor", total: 22900 },
    { id: 3, label: "Cable", total: 990 },
  ]

  const currency = cents => `€${(cents / 100).toFixed(2)}`
</script>

<h2>Orders</h2>

<List :rows="orders" :slot="{ item, index }">
  {{ index + 1 }}. <b>{{ item.label }}</b> — {{ currency(item.total) }}
</List>

<button @click="orders = []">Empty the list</button>
