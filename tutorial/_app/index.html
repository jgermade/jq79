<!--
  The tutorial's shell page - the only page of the site that isn't rendered from
  markdown, so it's the only one written by hand. It holds nothing but the mount:
  everything on screen is Tutorial.html, a jq79 component fetched at runtime, and
  the exercise the user is editing is compiled by the very same Component79 this
  page imports. hljs rides along as render data - the component colors the editor
  and the solution diff with it.

  The `{{...}}` holes are filled by scripts/build-site.mjs with what this page
  shares with the generated ones (the palette, the header nav, the favicons, the
  path of the bundled highlighter), so the shared chrome is written once. The
  file is a template, not a page: it is *not* copied to site/ as-is.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorial · jq79</title>
{{icons}}
<style>
/* the site's theme - palette, header, code tokens - shared with every page the
   build generates, so the prose, the editor and the diff are dressed by one
   stylesheet with the rest of the site */
{{styles}}

body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
/* the tutorial lays itself out against the viewport minus the header, so #app is
   the flex-grown remainder rather than a height of its own */
#app { flex: 1; min-height: 0; }
#app .failed { max-width: 860px; margin: 0 auto; padding: 2rem 1rem; }

/* on screen from the first paint until the layout is: the app renders once its
   panes are imported, which on a cold cache is a few round trips away. mount()
   appends rather than replacing, so the spinner steps aside on its own once the
   container is there, and a failure's innerHTML takes it away with the rest. It
   fades in late, so a warm load never flashes it */
#app .loading { min-height: calc(100dvh - var(--header-h)); display: grid; place-content: center; justify-items: center; gap: 0.9rem; color: var(--muted); font-size: 0.9rem; animation: loading-in 300ms 200ms ease-out backwards; }
#app .loading::before { content: ""; width: 2rem; height: 2rem; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: loading-spin 0.8s linear infinite; }
#app:has(.tutorial-container) .loading { display: none; }
@keyframes loading-in { from { opacity: 0; } }
@keyframes loading-spin { to { transform: rotate(1turn); } }
</style>
</head>
<body>
{{header}}
<div id="app"><div class="loading" role="status">Loading the tutorial…</div></div>
<script type="module">
import { Component79 } from "../jq79.js"

try {
  const [sections, app, hljs] = await Promise.all([
    fetch("./tutorial.json").then(response => response.json()),
    Component79.fetch("./Tutorial.html"),
    import("../{{hljs}}").then(module => module.default),
  ])
  app.mount("#app", { sections, Component79, hljs })
} catch (failure) {
  document.querySelector("#app").innerHTML =
    '<p class="failed">the tutorial failed to load: ' + failure.message + '</p>'
}
</script>
</body>
</html>
