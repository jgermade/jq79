<!--
  The tutorial's shell page - the only page of the site that isn't rendered from
  markdown, so it's the only one written by hand. It holds nothing but the mount:
  everything on screen is Tutorial.html, a jq79 component fetched at runtime, and
  the exercise the user is editing is compiled by the very same Component79 this
  page imports. hljs rides along as render data - the component colors the editor
  and the solution diff with it.

  The `{{...}}` holes are filled by scripts/build-site.mjs with what this page
  shares with the generated ones (the palette, the header nav, the favicons, the
  path of the bundled highlighter), so the shared chrome is written once. The
  file is a template, not a page: it is *not* copied to site/ as-is.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorial · jq79</title>
{{icons}}
<style>
/* the site's theme - palette, header, code tokens - shared with every page the
   build generates, so the prose, the editor and the diff are dressed by one
   stylesheet with the rest of the site */
{{styles}}

body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
/* the tutorial lays itself out against the viewport minus the header, so #app is
   the flex-grown remainder rather than a height of its own */
#app { flex: 1; min-height: 0; }
#app .failed { max-width: 860px; margin: 0 auto; padding: 2rem 1rem; }

/* on screen from the first paint until the layout is: the app renders once its
   panes are imported, which on a cold cache is a few round trips away. mount()
   appends rather than replacing, so the loader steps aside on its own once the
   container is there, and a failure's innerHTML takes it away with the rest. It
   fades in late, so a warm load never flashes it.
   The loader is the logo's glyphs, without its tile, inlined with the 7 and the
   9 split into the lines they are drawn with - outermost blue, then red, then
   green - so a wave can run through it piece by piece: j and q hop, the 7's
   three strokes slide up their diagonal one after another, and the 9's three
   rings ripple from the outside in, each glyph coming apart and back together
   as the wave passes. Their colours change while the pieces are still, at the
   end of a wave, with a fade: one wave in the logo's yellow, then blue, red and
   green, outermost line first, handed one line in on each of the next two
   waves, and back to yellow. The viewBox is the logo's 410-unit box cropped to
   where the pieces travel */
#app .loading { min-height: calc(100dvh - var(--header-h)); display: grid; place-content: center; justify-items: center; gap: 1rem; color: var(--muted); font-size: 0.9rem; animation: loading-in 300ms 200ms ease-out backwards; }
#app .loading svg { width: 6.5rem; height: auto; color: var(--fg); }
#app .loading g { animation: 1.4s var(--delay) ease-in-out infinite; }
#app .loading .hop { animation-name: loading-hop; }
#app .loading .slide { animation-name: loading-slide; }
/* the rings' common centre, in the logo's 410-unit box */
#app .loading .ripple { animation-name: loading-ripple; transform-origin: 337.5px 282.8px; }
#app .loading .line-1 path { animation: loading-line-1 5.6s infinite; }
#app .loading .line-2 path { animation: loading-line-2 5.6s infinite; }
#app .loading .line-3 path { animation: loading-line-3 5.6s infinite; }
#app:has(.tutorial-container) .loading { display: none; }
@keyframes loading-in { from { opacity: 0; } }
@keyframes loading-hop { 0%, 45%, 100% { transform: none; } 18% { transform: translateY(-60px); } }
/* along the 7's diagonal */
@keyframes loading-slide { 0%, 45%, 100% { transform: none; } 18% { transform: translate(14px, -38px); } }
@keyframes loading-ripple { 0%, 45%, 100% { transform: none; } 18% { transform: scale(1.2); } }
/* four waves long, each colour fading into the next in the last 0.3s of one */
@keyframes loading-line-1 { 0%, 19.6% { fill: #f7df1e; } 25%, 44.6% { fill: #4363d8; } 50%, 69.6% { fill: #3cb44b; } 75%, 94.6% { fill: #e6194b; } 100% { fill: #f7df1e; } }
@keyframes loading-line-2 { 0%, 19.6% { fill: #f7df1e; } 25%, 44.6% { fill: #e6194b; } 50%, 69.6% { fill: #4363d8; } 75%, 94.6% { fill: #3cb44b; } 100% { fill: #f7df1e; } }
@keyframes loading-line-3 { 0%, 19.6% { fill: #f7df1e; } 25%, 44.6% { fill: #3cb44b; } 50%, 69.6% { fill: #e6194b; } 75%, 94.6% { fill: #4363d8; } 100% { fill: #f7df1e; } }
</style>
</head>
<body>
{{header}}

  </svg>
  <span>Loading the tutorial…</span>
</div></div>
<script type="module">
import { Component79 } from "../jq79.js"

try {
  const [sections, app, hljs] = await Promise.all([
    fetch("./tutorial.json").then(response => response.json()),
    Component79.fetch("./Tutorial.html"),
    import("../{{hljs}}").then(module => module.default),
  ])
  app.mount("#app", { sections, Component79, hljs })
} catch (failure) {
  document.querySelector("#app").innerHTML =
    '<p class="failed">the tutorial failed to load: ' + failure.message + '</p>'
}
</script>
</body>
</html>
