<!--
  The table of contents: every section's exercises, with the one being read
  marked. It owns no state - which exercise is open is the app's business, so a
  click is reported as `tutorial:go` with the exercise's flat index.
-->
<script :setup="{ sections, path }">
  const go = index => $emit("tutorial:go", index)

  let collapsed = true
</script>

<aside class="toc" :class="{ collapsed }">
  <div class="collapse-toggle">
    <button @click="collapsed = !collapsed">
      <span :if="collapsed">☰</span>
      <span :else>✕</span>
      Table of contents
    </button>
  </div>
  <div class="chapter" :each="section in sections" :key="section.slug">
    <h3>{{ section.title }}</h3>
    <button
      :each="exercise in section.exercises"
      :key="exercise.path"
      :class="exercise.path === path ? 'link active' : 'link'"
      @click="go(exercise.index)"
    >{{ exercise.title }}</button>
  </div>
</aside>

<style>
  .toc { padding: 1.2rem 0.8rem; }

  /* collapse toggle: only visible on narrow screens */
  .collapse-toggle { display: none; }
  .collapse-toggle button {
    display: flex;
    align-items: center;
    gap: 0.4em;
    width: 100%;
    padding: 0.4em 0.6rem;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--accent);
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .collapse-toggle button:hover { background: var(--code-bg); }

  @media (max-width: 47.99rem) {
    .collapse-toggle { display: block; }
    .toc.collapsed .chapter { display: none; }
    .toc { padding: 0; }
  }

  .chapter h3 {
    margin: 0 0 0.4em;
    padding: 0 0.6rem;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .chapter + .chapter { margin-top: 1.4rem; }
  .link {
    display: block;
    width: 100%;
    padding: 0.4em 0.6rem;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--fg);
    font: inherit;
    font-size: 0.95rem;
    text-align: left;
    cursor: pointer;
  }
  .link:hover { background: var(--code-bg); }
  .link.active { background: var(--accent); color: #fff; }
</style>
