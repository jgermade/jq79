<!--
  The exercise's prose, plus the previous/next steps. `content` is the README
  rendered to HTML at build time (snippets already highlighted), so it goes in
  with :html; `index` and `total` are only here to say which step this is and to
  stop the arrows at the ends.
-->
<script :setup="{ content, index, total }">
  const go = position => $emit("tutorial:go", position)
</script>

<section class="text">
  <div class="readme" :html="content"></div>
  <nav class="steps">
    <button :disabled="index === 0" @click="go(index - 1)">← previous</button>
    <span>{{ index + 1 }} / {{ total }}</span>
    <button :disabled="index === total - 1" @click="go(index + 1)">next →</button>
  </nav>
</section>

<style>
  .text { display: flex; flex-direction: column; padding: 1.25rem 1rem 0; background: var(--bg); }
  @media (min-width: 56rem) { .text { padding: 2rem 2rem 0; } }
  .readme { flex: 1; max-width: 44rem; }
  .readme > :first-child { margin-top: 0; }
  .readme h1 { margin-bottom: 0.7em; font-size: clamp(1.6rem, 4vw, 2rem); line-height: 1.15; letter-spacing: -0.025em; font-weight: 800; }
  .readme h2 { margin-top: 1.8em; font-size: 1.2rem; letter-spacing: -0.01em; }
  .readme pre { font-size: 13px; }
  .readme blockquote {
    margin: 1.4em 0;
    padding: 0.9em 1.1em;
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--radius) var(--radius) 0;
    background: var(--accent-soft);
  }
  .readme blockquote :first-child { margin-top: 0; }
  .readme blockquote :last-child { margin-bottom: 0; }

  .steps {
    position: sticky;
    bottom: 0;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin: 2rem -1rem 0;
    padding: 0.75rem 1rem;
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  @media (min-width: 56rem) { .steps { margin: 2rem -2rem 0; padding: 0.9rem 2rem; } }
  .steps span { margin: 0 auto; color: var(--muted); font: 600 0.8rem var(--mono); }
  .steps button {
    padding: 0.5em 1em;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--fg);
    font: 600 0.9rem var(--font);
    cursor: pointer;
  }
  .steps button:last-child { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .steps button:hover:not(:disabled) { border-color: var(--accent); }
  .steps button:disabled { opacity: 0.4; cursor: default; }
</style>
