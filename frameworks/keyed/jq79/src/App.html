<script :setup>
  const { createDataBuilder } = await import("../../_shared/data.js")
  const buildData = createDataBuilder()

  let data = []
  let selected = null

  const run = () => { data = buildData(1000); selected = null }
  const runLots = () => { data = buildData(10000); selected = null }
  const add = () => { data = [...data, ...buildData(1000)] }
  const update = () => {
    for (let i = 0; i < data.length; i += 10) data[i].label += " !!!"
  }
  const clear = () => { data = []; selected = null }
  const swapRows = () => {
    if (data.length > 998) {
      const a = data[1]
      data[1] = data[998]
      data[998] = a
    }
  }
  const select = id => { selected = id }
  const remove = id => { data = data.filter(row => row.id !== id) }

  // the same rows as components, in a list of their own: the table above is the
  // js-framework-benchmark app and stays exactly that, and this one is what the
  // A/B harness reaches through renderNestedComponent with
  // (COMPONENT_OPERATIONS in scripts/lib/benchmark-ops.mjs)
  let componentData = []
  const runComponents = () => { componentData = buildData(1000) }
  const clearComponents = () => { componentData = [] }
</script>

<div class="container">
  <div class="jumbotron">
    <div class="row">
      <div class="col-md-6">
        <h1>jq79 (keyed)</h1>
      </div>
      <div class="col-md-6">
        <div class="row">
          <div class="col-sm-6 smallpad">
            <button type="button" class="btn btn-primary btn-block" id="run" @click="run">Create 1,000 rows</button>
          </div>
          <div class="col-sm-6 smallpad">
            <button type="button" class="btn btn-primary btn-block" id="runlots" @click="runLots">Create 10,000 rows</button>
          </div>
          <div class="col-sm-6 smallpad">
            <button type="button" class="btn btn-primary btn-block" id="add" @click="add">Append 1,000 rows</button>
          </div>
          <div class="col-sm-6 smallpad">
            <button type="button" class="btn btn-primary btn-block" id="update" @click="update">Update every 10th row</button>
          </div>
          <div class="col-sm-6 smallpad">
            <button type="button" class="btn btn-primary btn-block" id="clear" @click="clear">Clear</button>
          </div>
          <div class="col-sm-6 smallpad">
            <button type="button" class="btn btn-primary btn-block" id="swaprows" @click="swapRows">Swap Rows</button>
          </div>
          <div class="col-sm-6 smallpad">
            <button type="button" class="btn btn-primary btn-block" id="runcomponents" @click="runComponents">Create 1,000 component rows</button>
          </div>
          <div class="col-sm-6 smallpad">
            <button type="button" class="btn btn-primary btn-block" id="clearcomponents" @click="clearComponents">Clear component rows</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <table class="table table-hover table-striped test-data">
    <tbody id="tbody">
      <tr :each="row in data" :key="row.id" :class="{ danger: row.id === selected }">
        <td class="col-md-1">{{ row.id }}</td>
        <td class="col-md-4"><a @click="select(row.id)">{{ row.label }}</a></td>
        <td class="col-md-1"><a @click="remove(row.id)"><span class="glyphicon glyphicon-remove" aria-hidden="true"></span></a></td>
        <td class="col-md-6"></td>
      </tr>
    </tbody>
  </table>
  <!-- not a table: a component tag can't sit where a <tr> goes, and the
       parser moves it out (docs/template-syntax.md) -->
  <div id="ctbody">
    <Row :each="row in componentData" :key="row.id" :row />
  </div>
  <span class="preloadicon glyphicon glyphicon-remove" aria-hidden="true"></span>
</div>

<template name="Row">
  <script :setup="{ row }"></script>
  <div class="crow">
    <span class="col-md-1">{{ row.id }}</span>
    <span class="col-md-4"><a>{{ row.label }}</a></span>
    <span class="col-md-1"><a><span class="glyphicon glyphicon-remove" aria-hidden="true"></span></a></span>
  </div>
</template>
